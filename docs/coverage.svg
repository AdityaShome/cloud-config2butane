<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace">
  <style>
    .bg { fill: #eef0ec; }
    .track { fill: #e2e5df; }
    .bar { fill: #d8672a; }
    .label { fill: #12161b; font-size: 13px; }
    .pct { fill: #4a5a68; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181d; }
      .track { fill: #1c2126; }
      .bar { fill: #ef8a4a; }
      .label { fill: #eef0ec; }
      .pct { fill: #9aa7b0; }
    }
  </style>
  <rect class="bg" width="640" height="210" rx="4"/>

  <!-- convert: 100.0% -->
  <text class="label" x="16" y="24">convert</text>
  <rect class="track" x="140" y="12" width="460" height="16" rx="2"/>
  <rect class="bar" x="140" y="12" width="460" height="16" rx="2"/>
  <text class="pct" x="610" y="24" text-anchor="end">100.0%</text>

  <!-- butaneout: 87.1% -->
  <text class="label" x="16" y="62">butaneout</text>
  <rect class="track" x="140" y="50" width="460" height="16" rx="2"/>
  <rect class="bar" x="140" y="50" width="400.7" height="16" rx="2"/>
  <text class="pct" x="610" y="62" text-anchor="end">87.1%</text>

  <!-- validate: 83.3% -->
  <text class="label" x="16" y="100">validate</text>
  <rect class="track" x="140" y="88" width="460" height="16" rx="2"/>
  <rect class="bar" x="140" y="88" width="383.2" height="16" rx="2"/>
  <text class="pct" x="610" y="100" text-anchor="end">83.3%</text>

  <!-- cloudconfig: 81.3% -->
  <text class="label" x="16" y="138">cloudconfig</text>
  <rect class="track" x="140" y="126" width="460" height="16" rx="2"/>
  <rect class="bar" x="140" y="126" width="374" height="16" rx="2"/>
  <text class="pct" x="610" y="138" text-anchor="end">81.3%</text>

  <!-- cmd (CLI): 60.4% -->
  <text class="label" x="16" y="176">cmd (CLI)</text>
  <rect class="track" x="140" y="164" width="460" height="16" rx="2"/>
  <rect class="bar" x="140" y="164" width="277.8" height="16" rx="2"/>
  <text class="pct" x="610" y="176" text-anchor="end">60.4%</text>

  <text class="pct" x="16" y="200" font-size="11">go test ./... -race -cover</text>
</svg>
